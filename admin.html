<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Commissioner Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="appShell">
    <div class="masthead">
      <div class="mastBanner" aria-label="Wellman banner"></div>

      <div class="mastControls">
        <div class="mastControlsInner">
          <div class="seasonPill">Commissioner Dashboard</div>

          <div class="navRow">
            <a href="./index.html" class="navTab">Home</a>
            <a href="./draft.html" class="navTab">Draft</a>
            <a href="./rules.html" class="navTab">Rules</a>
            <a href="./admin.html" class="navTab navTabActive">Admin</a>
            <a href="./login.html" class="navTab" id="navAuthLink">Log in</a>
          </div>
        </div>
      </div>
    </div>

    <main class="main">
      <div class="pageWrap">

        <div class="card">
          <div class="cardTitle">Access</div>
          <div class="row">
            <div style="flex:1; min-width:240px">
              <label class="label">Admin token (PROAM_ADMIN_TOKEN)</label>
              <input class="input" id="adminToken" placeholder="Paste token here" />
              <div class="hint">Stored in this browser only. Required for any admin action.</div>
            </div>
            <div style="display:flex; gap:10px; align-items:flex-end">
              <button class="btn" id="btnSaveToken">Save Token</button>
              <button class="btn btnGhost" id="btnClearToken">Clear</button>
            </div>
          </div>
          <div class="msg" id="accessMsg" style="margin-top:10px;"></div>
        </div>

        <div class="card" style="margin-top:14px;">
          <div class="cardTitle">Week</div>
          <div class="row">
            <div style="flex:1; min-width:240px">
              <label class="label">Select week</label>
              <select class="select" id="weekSelect"></select>
            </div>
            <div style="display:flex; gap:10px; align-items:flex-end">
              <button class="btn btnGhost" id="btnRefreshWeek">Refresh</button>
              <button class="btn btnDanger" id="btnWipeWeek">Wipe ALL Week Data</button>
            </div>
          </div>

          <div class="grid2" style="margin-top:12px;">
            <div class="panel">
              <div class="panelTitle">Summary</div>
              <div id="weekSummary" class="monoSmall"></div>
            </div>
            <div class="panel">
              <div class="panelTitle">Participants</div>
              <div id="participantsBox"></div>
              <div class="msg" id="participantsMsg" style="margin-top:10px;"></div>
            </div>
          </div>

          <div class="divider"></div>

          <div class="tabs">
            <button class="tabBtn tabBtnActive" data-tab="draft">Draft</button>
            <button class="tabBtn" data-tab="tiers">Tiers</button>
            <button class="tabBtn" data-tab="users">Users</button>
          </div>

          <div id="tab-draft" class="tabPane tabPaneActive">
            <div class="panel">
              <div class="panelTitle">Draft Controls</div>

              <div class="row">
                <button class="btn" id="btnDraftInit">Initialize Draft</button>
                <button class="btn btnGhost" id="btnDraftLoad">Load Draft State</button>
                <button class="btn btnGhost" id="btnDraftOrder">Generate Draft Order</button>
                <button class="btn btnDanger" id="btnDraftWipe">Wipe Draft Only</button>
              </div>

              <div class="divider"></div>

              <div class="grid2">
                <div>
                  <label class="label">Status</label>
                  <select class="select" id="draftStatus">
                    <option value="PREP">PREP</option>
                    <option value="ORDER_PUBLISHED">ORDER_PUBLISHED</option>
                    <option value="LIVE">LIVE</option>
                    <option value="SWAP_OPEN">SWAP_OPEN</option>
                    <option value="LOCKED">LOCKED</option>
                    <option value="COMPLETE">COMPLETE</option>
                  </select>

                  <label class="label" style="margin-top:10px;">Draft starts at (ISO or empty)</label>
                  <input class="input" id="draftStartsAt" placeholder="2026-03-02T12:00:00Z" />

                  <label class="label" style="margin-top:10px;">Swap deadline at (ISO or empty)</label>
                  <input class="input" id="swapDeadlineAt" placeholder="2026-03-05T23:59:00Z" />

                  <div style="margin-top:10px;">
                    <button class="btn" id="btnDraftUpdate">Save Draft Settings</button>
                  </div>
                </div>

                <div>
                  <div class="panelTitle" style="margin-bottom:6px;">Draft State</div>
                  <div id="draftStateBox" class="monoSmall"></div>

                  <div class="divider"></div>

                  <div class="panelTitle" style="margin-bottom:6px;">Reset Pick</div>
                  <label class="label">User ID (from participant row)</label>
                  <input class="input" id="resetUserId" placeholder="uuid..." />
                  <button class="btn btnGhost" id="btnResetPick" style="margin-top:10px;">Reset Pick</button>

                  <div class="msg" id="draftMsg" style="margin-top:10px;"></div>
                </div>
              </div>
            </div>
          </div>

          <div id="tab-tiers" class="tabPane">
            <div class="panel">
              <div class="panelTitle">Tier Assignment (week_pro_field)</div>
              <div class="row">
                <button class="btn" id="btnLoadField">Load Field</button>
                <button class="btn btnGhost" id="btnAutoTier">Auto-tier by odds rank</button>
              </div>
              <div class="msg" id="tiersMsg" style="margin-top:10px;"></div>
              <div class="divider"></div>
              <div id="fieldTable"></div>
            </div>
          </div>

          <div id="tab-users" class="tabPane">
            <div class="panel">
              <div class="panelTitle">Users</div>
              <label class="label">Search by email</label>
              <div class="row">
                <input class="input" id="userSearch" placeholder="type email…" />
                <button class="btn" id="btnUserSearch">Search</button>
              </div>
              <div class="msg" id="usersMsg" style="margin-top:10px;"></div>
              <div class="divider"></div>
              <div id="usersTable"></div>
            </div>
          </div>

        </div>

      </div>
    </main>
  </div>

<script>
  // ---------- helpers ----------
  function $(id){ return document.getElementById(id); }
  function showMsg(el, msg, kind){
    if (!el) return;
    el.textContent = msg || "";
    el.className = "msg " + (kind === "bad" ? "msgBad" : kind === "good" ? "msgGood" : "");
  }
  function token(){ return localStorage.getItem("sb_access_token") || ""; }
  function adminToken(){ return localStorage.getItem("admin_token") || ""; }

  async function postAdmin(route, body){
    const t = adminToken();
    const jwt = token();
    const res = await fetch(`/.netlify/functions/admin/${route}`, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-admin-token": t,
        "Authorization": jwt ? `Bearer ${jwt}` : ""
      },
      body: JSON.stringify(body || {})
    });
    const txt = await res.text();
    let js = null;
    try { js = JSON.parse(txt); } catch { js = null; }
    if (!res.ok) {
      const msg = js?.error || txt || ("HTTP " + res.status);
      throw new Error(msg);
    }
    return js;
  }

  function currentWeekNumber(){
    const v = $("weekSelect").value;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  // ---------- nav auth ----------
  (function(){
    const link = $("navAuthLink");
    const t = token();
    if (link){
      if (t){
        link.href = "./profile.html";
        link.textContent = "Profile";
      } else {
        link.href = "./login.html";
        link.textContent = "Log in";
      }
    }
  })();

  // ---------- tabs ----------
  function setTab(name){
    document.querySelectorAll(".tabBtn").forEach(b => b.classList.toggle("tabBtnActive", b.dataset.tab === name));
    document.querySelectorAll(".tabPane").forEach(p => p.classList.toggle("tabPaneActive", p.id === "tab-" + name));
  }
  document.querySelectorAll(".tabBtn").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

  // ---------- token UI ----------
  $("adminToken").value = adminToken();
  $("btnSaveToken").addEventListener("click", () => {
    localStorage.setItem("admin_token", $("adminToken").value.trim());
    showMsg($("accessMsg"), "Saved.", "good");
    boot();
  });
  $("btnClearToken").addEventListener("click", () => {
    localStorage.removeItem("admin_token");
    $("adminToken").value = "";
    showMsg($("accessMsg"), "Cleared.", "");
  });

  // ---------- week loading ----------
  async function loadWeeks(){
    const sel = $("weekSelect");
    sel.innerHTML = "";
    const data = await postAdmin("list-weeks", {});
    const weeks = data.weeks || [];
    for (const w of weeks){
      const opt = document.createElement("option");
      opt.value = String(w.week_number);
      opt.textContent = `${w.label || ("Week " + w.week_number)} — ${w.tournament_name || ""}`;
      sel.appendChild(opt);
    }
    // default to week 0 if present
    const has0 = weeks.some(w => Number(w.week_number) === 0);
    if (has0) sel.value = "0";
  }

  async function refreshWeek(){
    const week = currentWeekNumber();
    if (week == null) return;

    showMsg($("participantsMsg"), "", "");
    showMsg($("draftMsg"), "", "");
    showMsg($("tiersMsg"), "", "");
    showMsg($("usersMsg"), "", "");

    const sum = await postAdmin("week-summary", { week_number: week });
    $("weekSummary").textContent = JSON.stringify(sum, null, 2);

    const parts = await postAdmin("participants-list", { week_number: week });
    renderParticipants(parts.participants || []);
    // also refresh draft state view
    await loadDraftState();
  }

  function renderParticipants(rows){
    const box = $("participantsBox");
    if (!rows.length){
      box.innerHTML = "<div class='hint'>No participants for this week.</div>";
      return;
    }
    const tbl = document.createElement("table");
    tbl.className = "table";
    tbl.innerHTML = `
      <thead>
        <tr>
          <th>Name</th>
          <th>Handicap</th>
          <th>User ID</th>
          <th>Pick</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    const tb = tbl.querySelector("tbody");
    rows.forEach(r => {
      const tr = document.createElement("tr");
      const name = r.player?.name || r.player_id;
      const hcp = (r.player?.handicap_index ?? "");
      const uid = r.player?.user_id || "";
      const pick = r.pick ? `${r.pick.pro_id} (T${r.pick.tier})` : "";
      tr.innerHTML = `
        <td>${escapeHtml(name)}</td>
        <td>${escapeHtml(String(hcp))}</td>
        <td class="monoSmall">${escapeHtml(uid)}</td>
        <td>${escapeHtml(pick)}</td>
        <td><button class="btn btnGhost btnSm">Remove</button></td>
      `;
      tr.querySelector("button").addEventListener("click", async () => {
        if (!confirm("Remove this participant from the week? This also deletes their score + draft pick for the week.")) return;
        try {
          await postAdmin("remove-participant", { week_number: currentWeekNumber(), player_id: r.player_id });
          showMsg($("participantsMsg"), "Removed.", "good");
          await refreshWeek();
        } catch (e){
          showMsg($("participantsMsg"), "Error: " + e.message, "bad");
        }
      });
      tb.appendChild(tr);
    });
    box.innerHTML = "";
    box.appendChild(tbl);
  }

  function escapeHtml(s){
    return String(s || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  $("btnRefreshWeek").addEventListener("click", () => refreshWeek());

  $("weekSelect").addEventListener("change", () => refreshWeek());

  $("btnWipeWeek").addEventListener("click", async () => {
    const wk = currentWeekNumber();
    if (wk == null) return;
    if (!confirm("WIPE ALL DATA for this week?\nThis removes participants, scores, and ALL draft tables for the week.")) return;
    try {
      await postAdmin("week-wipe-all", { week_number: wk });
      showMsg($("participantsMsg"), "Week wiped.", "good");
      await refreshWeek();
    } catch (e){
      showMsg($("participantsMsg"), "Error: " + e.message, "bad");
    }
  });

  // ---------- Draft tab ----------
  async function loadDraftState(){
    const wk = currentWeekNumber();
    if (wk == null) return;
    try {
      const d = await postAdmin("draft-get", { week_number: wk });
      $("draftStateBox").textContent = JSON.stringify(d, null, 2);

      if (d.draft){
        $("draftStatus").value = d.draft.status || "PREP";
        $("draftStartsAt").value = d.draft.draft_starts_at || "";
        $("swapDeadlineAt").value = d.draft.swap_deadline_at || "";
      }
    } catch (e){
      $("draftStateBox").textContent = "";
      showMsg($("draftMsg"), "Error: " + e.message, "bad");
    }
  }

  $("btnDraftLoad").addEventListener("click", () => loadDraftState());

  $("btnDraftInit").addEventListener("click", async () => {
    try {
      await postAdmin("draft-init", { week_number: currentWeekNumber() });
      showMsg($("draftMsg"), "Draft initialized.", "good");
      await loadDraftState();
    } catch (e){
      showMsg($("draftMsg"), "Error: " + e.message, "bad");
    }
  });

  $("btnDraftUpdate").addEventListener("click", async () => {
    try {
      await postAdmin("draft-update", {
        week_number: currentWeekNumber(),
        status: $("draftStatus").value,
        draft_starts_at: ($("draftStartsAt").value || null),
        swap_deadline_at: ($("swapDeadlineAt").value || null),
      });
      showMsg($("draftMsg"), "Saved.", "good");
      await loadDraftState();
    } catch (e){
      showMsg($("draftMsg"), "Error: " + e.message, "bad");
    }
  });

  $("btnDraftOrder").addEventListener("click", async () => {
    try {
      const out = await postAdmin("draft-generate-order", { week_number: currentWeekNumber() });
      showMsg($("draftMsg"), `Order generated (${out.count} players).`, "good");
      await loadDraftState();
    } catch (e){
      showMsg($("draftMsg"), "Error: " + e.message, "bad");
    }
  });

  $("btnResetPick").addEventListener("click", async () => {
    try {
      await postAdmin("draft-reset-pick", { week_number: currentWeekNumber(), user_id: $("resetUserId").value.trim() });
      showMsg($("draftMsg"), "Pick reset.", "good");
      await refreshWeek();
    } catch (e){
      showMsg($("draftMsg"), "Error: " + e.message, "bad");
    }
  });

  $("btnDraftWipe").addEventListener("click", async () => {
    if (!confirm("Wipe draft tables for this week only?")) return;
    try {
      await postAdmin("draft-wipe", { week_number: currentWeekNumber() });
      showMsg($("draftMsg"), "Draft wiped.", "good");
      await loadDraftState();
    } catch (e){
      showMsg($("draftMsg"), "Error: " + e.message, "bad");
    }
  });

  // ---------- Tiers tab ----------
  function renderField(field){
    const root = $("fieldTable");
    if (!field.length){
      root.innerHTML = "<div class='hint'>No field found. Run your field sync for this week first.</div>";
      return;
    }
    const tbl = document.createElement("table");
    tbl.className = "table";
    tbl.innerHTML = `
      <thead>
        <tr>
          <th>Odds Rank</th>
          <th>Player</th>
          <th>Odds</th>
          <th>Tier</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    const tb = tbl.querySelector("tbody");
    field.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(String(r.odds_rank ?? ""))}</td>
        <td>${escapeHtml(r.player_name || "")}</td>
        <td>${escapeHtml(r.odds_display || "")}</td>
        <td>
          <select class="select selectSm">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </td>
        <td><button class="btn btnGhost btnSm">Save</button></td>
      `;
      const sel = tr.querySelector("select");
      sel.value = String(r.tier ?? 4);
      tr.querySelector("button").addEventListener("click", async () => {
        try {
          await postAdmin("tiers-set", {
            week_number: currentWeekNumber(),
            player_ext_id: r.player_ext_id,
            tier: Number(sel.value)
          });
          showMsg($("tiersMsg"), "Saved.", "good");
        } catch (e){
          showMsg($("tiersMsg"), "Error: " + e.message, "bad");
        }
      });
      tb.appendChild(tr);
    });
    root.innerHTML = "";
    root.appendChild(tbl);
  }

  $("btnLoadField").addEventListener("click", async () => {
    try {
      const out = await postAdmin("tiers-list", { week_number: currentWeekNumber() });
      renderField(out.field || []);
      showMsg($("tiersMsg"), "", "");
    } catch (e){
      showMsg($("tiersMsg"), "Error: " + e.message, "bad");
    }
  });

  $("btnAutoTier").addEventListener("click", async () => {
    try {
      const out = await postAdmin("tiers-auto", { week_number: currentWeekNumber() });
      showMsg($("tiersMsg"), `Auto-tier complete (${out.updated} updated).`, "good");
      const refreshed = await postAdmin("tiers-list", { week_number: currentWeekNumber() });
      renderField(refreshed.field || []);
    } catch (e){
      showMsg($("tiersMsg"), "Error: " + e.message, "bad");
    }
  });

  // ---------- Users tab ----------
  function renderUsers(users){
    const root = $("usersTable");
    if (!users.length){
      root.innerHTML = "<div class='hint'>No matches.</div>";
      return;
    }
    const tbl = document.createElement("table");
    tbl.className = "table";
    tbl.innerHTML = `
      <thead>
        <tr>
          <th>Email</th>
          <th>Player</th>
          <th>Handicap</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    const tb = tbl.querySelector("tbody");
    users.forEach(u => {
      const tr = document.createElement("tr");
      const p = u.player;
      tr.innerHTML = `
        <td>${escapeHtml(u.email || "")}<div class="monoSmall">${escapeHtml(u.user_id || "")}</div></td>
        <td>${escapeHtml(p?.name || "(no player row)")}</td>
        <td>
          <input class="input inputSm" value="${escapeHtml(String(p?.handicap_index ?? ""))}" ${p ? "" : "disabled"} />
          <div class="monoSmall">${p ? escapeHtml(p.id) : ""}</div>
        </td>
        <td><button class="btn btnGhost btnSm" ${p ? "" : "disabled"}>Save</button></td>
      `;
      const inp = tr.querySelector("input");
      const btn = tr.querySelector("button");
      if (p){
        btn.addEventListener("click", async () => {
          try {
            await postAdmin("users-set-handicap", { player_id: p.id, handicap_index: Number(inp.value) });
            showMsg($("usersMsg"), "Saved.", "good");
          } catch (e){
            showMsg($("usersMsg"), "Error: " + e.message, "bad");
          }
        });
      }
      tb.appendChild(tr);
    });
    root.innerHTML = "";
    root.appendChild(tbl);
  }

  $("btnUserSearch").addEventListener("click", async () => {
    const q = $("userSearch").value.trim();
    if (!q) return;
    try {
      const out = await postAdmin("users-search", { query: q });
      renderUsers(out.users || []);
      showMsg($("usersMsg"), "", "");
    } catch (e){
      showMsg($("usersMsg"), "Error: " + e.message, "bad");
    }
  });

  async function boot(){
    try {
      if (!token()) {
        showMsg($("accessMsg"), "You must be logged in as the commissioner account to use this page.", "bad");
        return;
      }
      if (!adminToken()){
        showMsg($("accessMsg"), "Enter your admin token above to enable controls.", "");
        return;
      }
      await loadWeeks();
      await refreshWeek();
      showMsg($("accessMsg"), "Admin access OK.", "good");
    } catch (e){
      showMsg($("accessMsg"), "Access error: " + e.message, "bad");
    }
  }

  boot();
</script>
</body>
</html>
