<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week Leaderboard • Wellman Golf Club</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .dg-wrap{
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }
    .dg-card{
      background: rgba(8,14,26,.92);
      border:1px solid rgba(255,255,255,.10);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0,0,0,.28);
    }
    .dg-head{
      padding: 18px 20px 14px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
    }
    .dg-title{
      margin:0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -.02em;
      color:#eef4ff;
    }
    .dg-sub{
      margin-top:8px;
      color: rgba(233,241,255,.72);
      font-size: 15px;
    }
    .dg-actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .dg-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration:none;
      border:1px solid rgba(255,255,255,.14);
      color:#eef4ff;
      background: rgba(255,255,255,.04);
    }
    .dg-btn.primary{
      background: linear-gradient(135deg, #1de9b6, #43a5ff);
      color:#07111f;
      border:none;
    }
    .dg-frame-wrap{
      position: relative;
      width: 100%;
      min-height: 85vh;
      background: #fff;
    }
    .dg-frame{
      width:100%;
      min-height: 85vh;
      border:0;
      background:#fff;
    }
    .dg-fallback{
      padding: 22px 20px 26px;
      color: rgba(233,241,255,.78);
      background: rgba(255,255,255,.02);
      border-top:1px solid rgba(255,255,255,.08);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbarInner">
      <a class="brand" href="./index.html">
        <span class="brandDot"></span>
        <span>Wellman Golf Club</span>
      </a>
      <nav class="nav">
        <a href="./index.html">Home</a>
        <a class="active" href="./week-leaderboard.html">Week Leaderboard</a>
        <a href="./draft.html">Draft</a>
        <a href="./rules.html">Rules</a>
        <a href="./login.html">Log in</a>
      </nav>
    </div>
  </header>

  <main class="dg-wrap">
    <section class="dg-card">
      <div class="dg-head">
        <h1 class="dg-title">Full DataGolf Live Leaderboard</h1>
        <div class="dg-sub">Using DataGolf’s own live model page instead of a custom table.</div>
        <div class="dg-actions">
          <a class="dg-btn primary" href="https://datagolf.com/live-model/pga-tour" target="_blank" rel="noopener noreferrer">Open Full DataGolf Leaderboard</a>
          <a class="dg-btn" href="./index.html">Back to Home</a>
        </div>
      </div>

      <div class="dg-frame-wrap">
        <iframe
          class="dg-frame"
          src="https://datagolf.com/live-model/pga-tour"
          title="DataGolf Live Leaderboard"
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>

      <div class="dg-fallback">
        If the embedded view does not load, use “Open Full DataGolf Leaderboard” above.
      </div>
    </section>
  </main>
</body>
</html>
