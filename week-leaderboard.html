<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week Leaderboard • Wellman Golf Club</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <header class="topbar">
    <div class="topbarInner">
      <a class="brand" href="./index.html">
        <span class="brandDot"></span>
        <span>Wellman Golf Club</span>
      </a>
      <nav class="nav">
        <a href="./index.html">Home</a>
        <a class="active" href="./week-leaderboard.html">Week Leaderboard</a>
        <a href="./draft.html">Draft</a>
        <a href="./rules.html">Rules</a>
        <a href="./login.html">Log in</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="heroLeft">
        <div class="eyebrow">PGA TOUR • Live leaderboard</div>
        <h1 id="tournamentName" class="h1">Week Leaderboard</h1>
        <div id="tournamentDates" class="sub">—</div>
        <div class="metaRow">
          <span id="lastUpdatedBadge" class="badge gray">Updated: —</span>
        </div>
      </div>
      <div class="heroRight">
        <img id="tournamentLogo" class="logo" alt="Tournament logo" style="display:none;" />
      </div>
    </section>

    <section class="card">
      <div class="cardHead">
        <div>
          <div class="cardTitle">Pro Leaderboard</div>
          <div class="cardSub">POS • PLAYER • TOT</div>
        </div>
        <div id="lbMsg" class="msg" style="display:none;"></div>
      </div>

      <div class="tableWrap">
        <table class="tbl">
          <thead>
            <tr>
              <th class="center" style="width:90px;">Pos</th>
              <th>Player</th>
              <th class="center" style="width:120px;">Tot</th>
            </tr>
          </thead>
          <tbody id="lbBody">
            <tr><td colspan="3" style="color:rgba(233,241,255,.45);">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API = { currentWeek: "/api/current-week", proLeaderboard: "/api/pro-leaderboard" };
    const $ = (id) => document.getElementById(id);

    function showMsg(el, text, kind="bad"){
      if(!el) return;
      el.style.display = "block";
      el.className = "msg " + (kind === "good" ? "good" : "bad");
      el.textContent = text;
    }
    function hideMsg(el){ if(el) el.style.display = "none"; }

    async function getJSON(url){
      const res = await fetch(url, { headers: { "accept": "application/json" }});
      if(!res.ok){
        const t = await res.text();
        throw new Error(`HTTP ${res.status}: ${t}`);
      }
      return await res.json();
    }

    function setHero(week){
      $("tournamentName").textContent = week?.tournament_name || "Week Leaderboard";
      const s = week?.start_date ? String(week.start_date).slice(0,10) : "";
      const e = week?.end_date ? String(week.end_date).slice(0,10) : "";
      $("tournamentDates").textContent = (s && e) ? `${s} → ${e}` : "—";

      const logo = week?.logo_url;
      const img = $("tournamentLogo");
      if(img && logo){
        img.src = logo;
        img.style.display = "block";
      } else if(img) {
        img.style.display = "none";
      }
    }

    function updateLastUpdated(ts){
      const el = $("lastUpdatedBadge");
      const d = ts ? new Date(ts) : new Date();
      el.textContent = "Updated: " + d.toLocaleTimeString();
    }

    function formatScore(n){
      if(n === null || n === undefined) return null;
      const num = Number(n);
      if(!Number.isFinite(num)) return null;
      if(num > 0) return "+" + num;
      return String(num);
    }

    function renderRows(rows){
      if(!Array.isArray(rows) || rows.length === 0){
        $("lbBody").innerHTML = `<tr><td colspan="3" style="color:rgba(233,241,255,.45);">No live leaderboard rows yet.</td></tr>`;
        return;
      }

      $("lbBody").innerHTML = rows.map((r) => {

        // POSITION DISPLAY
        const pos = r.position_display ?? r.position ?? "-";

        // PLAYER
        const name = r.player_name || "-";

        // SCORE DISPLAY
        let tot = r.tot_display;

        if(tot === null || tot === undefined){
          if(r.today !== null && r.today !== undefined){
            tot = formatScore(r.today);
          } else if(r.score_to_par !== null && r.score_to_par !== undefined){
            tot = formatScore(r.score_to_par);
          } else {
            tot = "-";
          }
        }

        return `
          <tr>
            <td class="mono center"><span class="rankPill">${pos}</span></td>
            <td class="playerCell">${name}</td>
            <td class="mono center"><span class="totalPill">${tot}</span></td>
          </tr>
        `;
      }).join("");
    }

    async function load(){
      hideMsg($("lbMsg"));
      $("lbBody").innerHTML = `<tr><td colspan="3" style="color:rgba(233,241,255,.45);">Loading…</td></tr>`;

      try {
        const cw = await getJSON(API.currentWeek);
        const week = cw.week;

        if(!week){
          $("lbBody").innerHTML = `<tr><td colspan="3" style="color:rgba(233,241,255,.45);">No current week found.</td></tr>`;
          return;
        }

        setHero(week);

        const data = await getJSON(`${API.proLeaderboard}?week_id=${encodeURIComponent(week.week_number)}`);

        renderRows(data.rows || []);

        updateLastUpdated(data.week?.leaderboard_last_synced_at || null);

        const status = ((data.week?.pro_leaderboard_status) || "").toLowerCase();

        if(status === "live"){
          setInterval(async () => {
            try {
              const fresh = await getJSON(`${API.proLeaderboard}?week_id=${encodeURIComponent(week.week_number)}`);
              renderRows(fresh.rows || []);
              updateLastUpdated(fresh.week?.leaderboard_last_synced_at || null);
            } catch(e) {}
          }, 60000);
        }

      } catch(e) {
        $("lbBody").innerHTML = `<tr><td colspan="3" style="color:rgba(233,241,255,.45);">Couldn’t load leaderboard.</td></tr>`;
        showMsg($("lbMsg"), "Week Leaderboard error: " + e.message, "bad");
      }
    }

    load();
  </script>
</body>
</html>
