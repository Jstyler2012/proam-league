<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Draft</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>

<div class="wrap">

  <div class="row">
    <div class="card" style="flex:1">
      <h3>Week</h3>
      <select id="weekSel"></select>
      <div id="weekMeta" style="margin-top:10px"></div>
      <button class="btn secondary" id="refreshBtn" style="margin-top:10px">Refresh</button>
    </div>

    <div class="card" style="flex:1">
      <h3>Status</h3>
      <div class="row" style="gap:8px">
        <span class="badge muted" id="badgeParticipating">Participating: —</span>
        <span class="badge muted" id="badgeDraft">Draft: —</span>
      </div>
      <div style="margin-top:10px" id="draftStatus">—</div>
    </div>
  </div>

  <div class="row" style="margin-top:12px">
    <div class="card" style="flex:1">
      <h3>Controls</h3>

      <button class="btn secondary" id="joinBtn">Participate this week</button>

      <div style="margin-top:12px">
        <label>Select Pro</label><br/>
        <select id="proSel" style="width:100%"></select>
      </div>

      <div style="margin-top:12px">
        <button class="btn" id="pickBtn">Submit</button>
        <div id="pickMsg" class="msg"></div>
      </div>
    </div>

    <div class="card" style="flex:1">
      <h3>Participants</h3>
      <ul id="playerList"></ul>
    </div>
  </div>

</div>

<script>
/* =======================================================
   CONFIG
======================================================= */

const POLL_MS = 2000;
const PICK_SECONDS = 60;

/* =======================================================
   STATE
======================================================= */

let currentWeek = null;
let weeks = [];
let me = null;
let draftState = null;
let boardRows = [];
let pros = [];

let countdownInterval = null;
let pollInterval = null;
let lastTurnStartedAtMs = null;

/* =======================================================
   HELPERS
======================================================= */

const $ = id => document.getElementById(id);

function escapeHTML(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

async function getJSON(url){
  const token = localStorage.getItem("sb_access_token") || "";
  const headers = { "Accept":"application/json" };
  if(token) headers["Authorization"] = "Bearer " + token;

  const r = await fetch(url, { headers });
  const txt = await r.text();
  const j = txt ? JSON.parse(txt) : null;
  if(!r.ok) throw new Error(j?.error || txt);
  return j;
}

async function postJSON(url, body){
  const token = localStorage.getItem("sb_access_token") || "";
  const headers = { "Content-Type":"application/json" };
  if(token) headers["Authorization"] = "Bearer " + token;

  const r = await fetch(url, { method:"POST", headers, body: JSON.stringify(body||{}) });
  const txt = await r.text();
  const j = txt ? JSON.parse(txt) : null;
  if(!r.ok) return { ok:false, error:j?.error||txt };
  return j || { ok:true };
}

/* =======================================================
   COUNTDOWN LOOP
======================================================= */

function startCountdownLoop(){
  if(countdownInterval) clearInterval(countdownInterval);

  countdownInterval = setInterval(() => {

    const el = $("draftStatus");
    if(!draftState || draftState.status !== "LIVE"){
      return;
    }

    if(!lastTurnStartedAtMs){
      return;
    }

    const elapsed = Math.floor((Date.now() - lastTurnStartedAtMs)/1000);
    const remaining = Math.max(0, PICK_SECONDS - elapsed);

    const on = boardRows.find(r => String(r.player_id) === String(draftState.turn_player_id));
    const who = on?.player_name || "—";

    el.innerHTML = `
      <b>Status:</b> LIVE<br>
      <b>On the clock:</b> ${escapeHTML(who)}<br>
      <b>Time remaining:</b> ${remaining}s
    `;

  }, 1000);
}

/* =======================================================
   POLLING LOOP
======================================================= */

async function pollDraft(){
  if(!currentWeek) return;

  try{
    await postJSON("/api-mutate/draft-tick", { week_id: currentWeek.week_number });
  }catch(e){}

  try{
    const state = await getJSON(`/api/draft-state?week_id=${currentWeek.week_number}`);
    draftState = state?.draft || null;

    if(draftState?.turn_started_at){
      lastTurnStartedAtMs = Date.parse(draftState.turn_started_at);
    }else{
      lastTurnStartedAtMs = null;
    }

    const board = await getJSON(`/api/draft-board?week_id=${currentWeek.week_number}`);
    boardRows = board?.rows || [];

    renderBoard();
    renderStatus();

  }catch(e){
    console.error("poll error", e);
  }
}

function startPolling(){
  if(pollInterval) clearInterval(pollInterval);

  pollDraft();
  pollInterval = setInterval(pollDraft, POLL_MS);
}

/* =======================================================
   RENDER
======================================================= */

function renderStatus(){
  const el = $("draftStatus");

  if(!draftState){
    el.textContent = "Draft unavailable";
    return;
  }

  const status = draftState.status;

  $("badgeDraft").textContent = "Draft: " + status;

  if(status !== "LIVE"){
    el.innerHTML = `<b>Status:</b> ${escapeHTML(status)}`;
    return;
  }

  // LIVE handled by countdown loop
}

function renderBoard(){
  const list = $("playerList");
  list.innerHTML = "";

  for(const p of boardRows){
    const li = document.createElement("li");
    li.innerHTML = `<b>${escapeHTML(p.player_name)}</b> — ${escapeHTML(p.pro_id||"—")}`;
    list.appendChild(li);
  }
}

/* =======================================================
   BOOT
======================================================= */

async function boot(){
  try{

    const schedule = await getJSON("/api/schedule");
    weeks = schedule || [];

    $("weekSel").innerHTML = "";
    for(const w of weeks){
      const opt = document.createElement("option");
      opt.value = w.week_number;
      opt.textContent = `${w.week_number}: ${w.tournament_name}`;
      $("weekSel").appendChild(opt);
    }

    currentWeek = weeks[0];

    await pollDraft();
    startPolling();
    startCountdownLoop();

  }catch(e){
    console.error(e);
  }
}

$("weekSel").addEventListener("change", async ()=>{
  const wn = Number($("weekSel").value);
  currentWeek = weeks.find(w => w.week_number === wn);
  await pollDraft();
});

boot();

</script>
</body>
</html>
