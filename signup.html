<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign Up • Wellman Golf Club PRO-AM 2026</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="wrap">
    <div>
      <div class="pageTitle">Sign Up</div>
      <div class="pageSub">Create your account • set your handicap • start drafting</div>
    </div>

    <div id="siteHeader" class="sectionRule"></div>
    <script src="./partials/header.js"></script>

    <div class="card">
      <div class="hd">
        <div class="hTitle">Create account</div>
      </div>

      <div class="bd">
        <div class="fieldRow">
          <label class="label" for="name">Name</label>
          <input id="name" class="input" placeholder="Your name" />
        </div>

        <div class="fieldRow">
          <label class="label" for="hcp">Handicap Index</label>
          <input id="hcp" class="input" placeholder="e.g., 10.2" />
        </div>

        <div class="fieldRow">
          <label class="label" for="email">Email</label>
          <input id="email" class="input" type="email" placeholder="you@email.com" autocomplete="email" />
        </div>

        <div class="fieldRow">
          <label class="label" for="password">Password</label>
          <input id="password" class="input" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <button id="signupBtn" class="btnPrimary">Sign up</button>

        <div id="msg" class="msg" style="display:none;"></div>

        <div class="muted" style="margin-top:10px;">
          Already have an account? <a href="./login.html">Log in</a>.
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase JS + centralized config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>

  <script>
    loadHeader("signup");

    const API = { join: "/api-auth/join" };
    const $ = (id) => document.getElementById(id);

    function show(text, type){
      const el = $("msg");
      el.style.display = "block";
      el.className = "msg" + (type ? " " + type : "");
      el.textContent = text;
    }

    function setBusy(isBusy){
      $("signupBtn").disabled = !!isBusy;
      $("signupBtn").textContent = isBusy ? "Creating..." : "Sign up";
    }

    $("signupBtn").addEventListener("click", onSignup);

    async function onSignup(){
      const name = ($("name").value || "").trim();
      const hcpRaw = ($("hcp").value || "").trim();
      const email = ($("email").value || "").trim();
      const password = $("password").value || "";

      if(!name) return show("Name is required.", "bad");
      if(!email || !password) return show("Email and password required.", "bad");

      // Allow blank handicap, otherwise validate number
      let handicap_index = null;
      if(hcpRaw){
        const n = Number(hcpRaw);
        if(Number.isNaN(n)) return show("Handicap must be a number.", "bad");
        handicap_index = n;
      }

      setBusy(true);
      try {
        // 1) Create auth user
        const { data, error } = await window.sb.auth.signUp({ email, password });
        if(error){
          show(error.message || "Signup failed.", "bad");
          return;
        }

        // 2) If we got a session, store tokens so the rest of your site works immediately
        const accessToken = data?.session?.access_token || "";
        const refreshToken = data?.session?.refresh_token || "";
        if (accessToken) {
          localStorage.setItem("sb_access_token", accessToken);
          if (refreshToken) localStorage.setItem("sb_refresh_token", refreshToken);
        }

        // 3) Create/update player profile via your server function (uses logged-in user)
        if (accessToken) {
          const r = await fetch(API.join, {
            method: "POST",
            headers: {
              "content-type":"application/json",
              "authorization":"Bearer " + accessToken
            },
            body: JSON.stringify({ name, handicap_index })
          });

          if(!r.ok){
            const t = await r.text();
            show("Signed up but profile creation failed: " + t, "bad");
            return;
          }
        }

        show("Signup successful.", "good");
        setTimeout(() => (window.location.href = "./index.html"), 600);
      } catch (e) {
        show(e.message || "Unexpected error.", "bad");
      } finally {
        setBusy(false);
      }
    }
  </script>
</body>
</html>
