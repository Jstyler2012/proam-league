<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign Up • WGC PRO AM</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="wrap">
    <div>
      <div class="pageTitle">Sign Up</div>
      <div class="pageSub">Create your account and profile</div>
    </div>

    <div id="siteHeader" class="sectionRule"></div>
    <script src="./partials/header.js"></script>

    <div class="card">
      <div class="hd">
        <div class="hTitle">Create account</div>
      </div>

      <div class="bd">
        <div class="fieldRow">
          <label class="label" for="name">Name</label>
          <input id="name" class="input" placeholder="Your name" />
        </div>

        <div class="fieldRow">
          <label class="label" for="hcp">Handicap Index</label>
          <input id="hcp" class="input" placeholder="e.g., 10.2" />
        </div>

        <div class="fieldRow">
          <label class="label" for="email">Email</label>
          <input id="email" class="input" type="email" placeholder="you@email.com" autocomplete="email" />
        </div>

        <div class="fieldRow">
          <label class="label" for="password">Password</label>
          <input id="password" class="input" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <button id="signupBtn" class="btnPrimary">Sign up</button>
        <div id="msg" class="msg" style="display:none;"></div>

        <div class="muted" style="margin-top:10px;">
          Already have an account? <a href="./login.html">Log in</a>.
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>

  <script>
    loadHeader("signup");

    const $ = (id) => document.getElementById(id);

    function show(text, type){
      const el = $("msg");
      el.style.display = "block";
      el.className = "msg" + (type ? " " + type : "");
      el.textContent = text;
    }

    function setBusy(isBusy){
      $("signupBtn").disabled = !!isBusy;
      $("signupBtn").textContent = isBusy ? "Creating..." : "Sign up";
    }

    $("signupBtn").addEventListener("click", onSignup);

    async function onSignup(){
      const name = ($("name").value || "").trim();
      const hcpRaw = ($("hcp").value || "").trim();
      const email = ($("email").value || "").trim();
      const password = $("password").value || "";

      if(!name) return show("Name is required.", "bad");
      if(!email || !password) return show("Email and password required.", "bad");

      let handicap_index = null;
      if(hcpRaw){
        const n = Number(hcpRaw);
        if(Number.isNaN(n)) return show("Handicap must be a number.", "bad");
        handicap_index = n;
      }

      setBusy(true);
      try {
        // 1) create auth user
        // Store pending profile so we can create it after email confirmation redirect
localStorage.setItem("pending_profile_name", name);
localStorage.setItem("pending_profile_hcp", String(handicap_index ?? ""));

// Store pending profile locally so callback can finish setup
localStorage.setItem("pending_profile_name", name);
localStorage.setItem("pending_profile_hcp", String(handicap_index ?? ""));

const { data, error } = await window.sb.auth.signUp({
  email,
  password,
  options: {
    emailRedirectTo: `${window.location.origin}/auth-callback.html`,
    data: {
      name,
      handicap_index: handicap_index ?? null
    }
  }
});

if (error) throw error;

const session = data?.session || null;
const accessToken = session?.access_token || null;

// If email confirmation is required, Supabase will not return a session yet.
// Callback page will finish login and profile creation.
if (!accessToken) {
  show("Account created. Check your email to confirm. You’ll be signed in automatically after confirming.", "good");
  return;
}

// If confirmation not required (rare), finish immediately
localStorage.setItem("sb_access_token", accessToken);
if (session?.refresh_token) localStorage.setItem("sb_refresh_token", session.refresh_token);

const r = await fetch("/api-auth/join", {
  method: "POST",
  headers: {
    "content-type": "application/json",
    "authorization": "Bearer " + accessToken
  },
  body: JSON.stringify({ name, handicap_index })
});
        if (!r.ok) {
          const t = await r.text();
          return show("Signed up, but profile creation failed: " + t, "bad");
        }

        show("Signup + profile created. Redirecting...", "good");
        setTimeout(() => (window.location.href = "./index.html"), 500);

      } catch (e) {
        show(e.message || "Unexpected error.", "bad");
      } finally {
        setBusy(false);
      }
    }
  </script>
</body>
</html>
