<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Profile • WGC PRO AM</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="wrap">
    <div>
      <div class="pageTitle">Profile</div>
      <div class="pageSub">Your account and player info</div>
    </div>

    <div id="siteHeader" class="sectionRule"></div>
    <script src="./partials/header.js"></script>

    <div class="card">
      <div class="hd">
        <div class="hTitle">Account</div>
      </div>
      <div class="bd">
        <div class="fieldRow">
          <div class="label">Email</div>
          <div id="emailVal" class="muted">—</div>
        </div>
        <div class="fieldRow">
          <div class="label">User ID</div>
          <div id="userIdVal" class="muted" style="word-break:break-all;">—</div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="hd">
        <div class="hTitle">Player Profile</div>
      </div>

      <div class="bd">
        <div id="profileMsg" class="msg" style="display:none;"></div>

        <div class="fieldRow">
          <label class="label" for="name">Name</label>
          <input id="name" class="input" placeholder="Your name" />
        </div>

        <div class="fieldRow">
          <label class="label" for="hcp">Handicap Index</label>
          <input id="hcp" class="input" placeholder="e.g., 10.2" />
        </div>

        <button id="saveBtn" class="btnPrimary">Save profile</button>
      </div>
    </div>
  </div>

  <script>
    loadHeader("profile");

    const $ = (id) => document.getElementById(id);

    function token() {
      return localStorage.getItem("sb_access_token") || "";
    }

    function show(text, type) {
      const el = $("profileMsg");
      el.style.display = "block";
      el.className = "msg" + (type ? " " + type : "");
      el.textContent = text;
    }

    function setBusy(isBusy) {
      $("saveBtn").disabled = !!isBusy;
      $("saveBtn").textContent = isBusy ? "Saving..." : "Save profile";
    }

    async function loadMe() {
      const t = token();
      if (!t) {
        window.location.href = "./login.html";
        return;
      }

      const r = await fetch("/api/me", {
        headers: { Authorization: "Bearer " + t }
      });

      const j = await r.json().catch(() => null);

      if (!r.ok) {
        // token expired or invalid
        localStorage.removeItem("sb_access_token");
        localStorage.removeItem("sb_refresh_token");
        window.location.href = "./login.html";
        return;
      }

      $("emailVal").textContent = j?.user?.email || "—";
      $("userIdVal").textContent = j?.user?.id || "—";

      // if player exists, populate form
      if (j?.player) {
        $("name").value = j.player.name || "";
        $("hcp").value = (j.player.handicap_index ?? "") === null ? "" : String(j.player.handicap_index ?? "");
      } else {
        show("No player profile found yet. Enter your name and handicap and click Save.", "bad");
      }
    }

    $("saveBtn").addEventListener("click", async () => {
      const t = token();
      if (!t) return (window.location.href = "./login.html");

      const name = ($("name").value || "").trim();
      const hcpRaw = ($("hcp").value || "").trim();

      if (!name) return show("Name is required.", "bad");

      let handicap_index = null;
      if (hcpRaw) {
        const n = Number(hcpRaw);
        if (Number.isNaN(n)) return show("Handicap must be a number.", "bad");
        handicap_index = n;
      }

      setBusy(true);
      try {
        const r = await fetch("/api-auth/join", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "authorization": "Bearer " + t
          },
          body: JSON.stringify({ name, handicap_index })
        });

        if (!r.ok) {
          const txt = await r.text();
          return show("Save failed: " + txt, "bad");
        }

        show("Profile saved.", "good");
        await loadMe();
      } catch (e) {
        show(e.message || "Unexpected error.", "bad");
      } finally {
        setBusy(false);
      }
    });

    loadMe();
  </script>
</body>
</html>
