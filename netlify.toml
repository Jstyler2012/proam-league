[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/public"
  status = 200

[[redirects]]
  from = "/api-auth/*"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api-mutate/*"
  to = "/.netlify/functions/mutate"
  status = 200

[[redirects]]
  from = "/api-proscore"
  to = "/.netlify/functions/proscore"
  status = 200

[[redirects]]
  from = "/api-admin/*"
  to = "/.netlify/functions/admin"
  status = 200
