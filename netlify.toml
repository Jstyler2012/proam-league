[build]
  functions = "netlify/functions"

# --- Scheduled function ---
# Runs every 6 hours (CRON is interpreted in UTC). :contentReference[oaicite:1]{index=1}
[functions."sync-field"]
  schedule = "0 */6 * * *"

# --- Your existing API gateway redirects ---
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/public/:splat"
  status = 200

[[redirects]]
  from = "/api-auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

[[redirects]]
  from = "/api-mutate/*"
  to = "/.netlify/functions/mutate/:splat"
  status = 200

[[redirects]]
  from = "/api-admin/*"
  to = "/.netlify/functions/admin/:splat"
  status = 200

[[redirects]]
  from = "/api-proscore"
  to = "/.netlify/functions/proscore"
  status = 200
